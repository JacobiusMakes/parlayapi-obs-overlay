<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ParlayAPI Best Lines Overlay</title>
<!--
  ParlayAPI OBS overlay: rotating best-line ticker for betting streamers.
  Add this file as an OBS Browser Source. Keyless by design: it only calls
  the free public live surface at parlay-api.com, so there is no API key
  to leak on stream. See README.md for setup and URL parameters.

  URL parameters:
    sport  nfl | nba | mlb | nhl | ncaaf | ncaab | wnba | epl | any sport_key (default: all sports)
    theme  dark | light (default: dark)
    speed  seconds each game stays on screen (default: 8, min 3)
    max    max games in rotation (default: 10, cap 15)
    bg     1 = paint a dark test backdrop so you can preview outside OBS (never use in OBS)
-->
<style>
  :root {
    --pill-bg: rgba(10, 14, 22, 0.86);
    --pill-border: rgba(255, 255, 255, 0.14);
    --text-main: #f2f5f9;
    --text-dim: rgba(242, 245, 249, 0.62);
    --accent: #34d399;
    --accent-neg: #f87171;
    --tag-bg: rgba(52, 211, 153, 0.16);
    --tag-text: #6ee7b7;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  }
  html.theme-light {
    --pill-bg: rgba(255, 255, 255, 0.92);
    --pill-border: rgba(15, 23, 42, 0.12);
    --text-main: #0f172a;
    --text-dim: rgba(15, 23, 42, 0.6);
    --accent: #047857;
    --accent-neg: #b91c1c;
    --tag-bg: rgba(4, 120, 87, 0.1);
    --tag-text: #047857;
    --shadow: 0 6px 24px rgba(15, 23, 42, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html.test-bg body {
    background: radial-gradient(1200px 700px at 50% 30%, #1e293b 0%, #0b1120 70%);
  }
  #bar {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    width: min(1560px, 94vw);
    height: 88px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 26px;
    border-radius: 16px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    box-shadow: var(--shadow);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #bar.ready { opacity: 1; }
  #brand {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    flex: 0 0 auto;
    padding-right: 20px;
    border-right: 1px solid var(--pill-border);
  }
  #brand .title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-main);
  }
  #livedot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  #livedot.stale { background: #fbbf24; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  #sporttag {
    align-self: flex-start;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--tag-text);
    background: var(--tag-bg);
    padding: 2px 8px;
    border-radius: 6px;
  }
  #stage {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .card {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 26px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    white-space: nowrap;
  }
  .card.on { opacity: 1; transform: translateY(0); }
  .matchup {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 0 1 auto;
  }
  .teams {
    font-size: 25px;
    font-weight: 650;
    color: var(--text-main);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .teams .at { color: var(--text-dim); font-weight: 400; padding: 0 4px; }
  .meta { font-size: 13px; color: var(--text-dim); }
  .prices { display: flex; gap: 22px; flex: 0 0 auto; }
  .side { display: flex; flex-direction: column; gap: 2px; }
  .side .odds { font-size: 25px; font-weight: 750; color: var(--accent); }
  .side .odds.neg { color: var(--accent-neg); }
  .side .book { font-size: 13px; color: var(--text-dim); }
  .side .book b { color: var(--text-main); font-weight: 600; }
  #attrib {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    padding-left: 20px;
    border-left: 1px solid var(--pill-border);
  }
  #attrib .src { font-size: 13px; font-weight: 600; color: var(--text-dim); }
  #attrib .src b { color: var(--text-main); }
  #attrib .note { font-size: 11px; color: var(--text-dim); }
  #empty {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    font-size: 18px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div id="bar" role="marquee" aria-label="Live best betting lines">
    <div id="brand">
      <div class="title"><span id="livedot"></span>BEST LINES</div>
      <span id="sporttag">ALL SPORTS</span>
    </div>
    <div id="stage">
      <div id="empty">waiting for lines...</div>
    </div>
    <div id="attrib">
      <span class="src">data: <b>parlay-api.com</b></span>
      <span class="note">free live preview</span>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var API_BASE = "https://parlay-api.com/live/api/command_center";
  var REFRESH_MS = 60000; // one request per minute: quota-polite by design

  var params = new URLSearchParams(window.location.search);
  var sport = (params.get("sport") || "").trim();
  var theme = (params.get("theme") || "dark").toLowerCase();
  var speed = Math.max(3, parseFloat(params.get("speed")) || 8);
  var maxGames = Math.min(15, Math.max(1, parseInt(params.get("max"), 10) || 10));

  if (theme === "light") document.documentElement.classList.add("theme-light");
  if (params.get("bg") === "1") document.documentElement.classList.add("test-bg");

  // Keys are intentionally not supported. An API key pasted into an OBS
  // browser source URL shows up in settings screens and screen shares and
  // leaks on stream. This overlay only uses the keyless public surface.
  if (params.get("apiKey") || params.get("key") || params.get("api_key")) {
    console.warn("ParlayAPI overlay: API keys are ignored on purpose. Keys in OBS URLs leak on stream. This overlay is keyless only.");
  }

  var bar = document.getElementById("bar");
  var stage = document.getElementById("stage");
  var emptyEl = document.getElementById("empty");
  var sporttag = document.getElementById("sporttag");
  var livedot = document.getElementById("livedot");

  var games = [];
  var idx = 0;
  var currentCard = null;
  var failCount = 0;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtOdds(price) {
    if (typeof price !== "number") return "";
    return price > 0 ? "+" + price : String(price);
  }

  function fmtBook(name) {
    if (!name) return "";
    var pretty = {
      fanduel: "FanDuel", draftkings: "DraftKings", betmgm: "BetMGM",
      pinnacle: "Pinnacle", caesars: "Caesars", betrivers: "BetRivers",
      pointsbetus: "PointsBet", superbet: "Superbet", rushbet: "RushBet",
      bovada: "Bovada", betonlineag: "BetOnline", bet365: "bet365",
      williamhill_us: "Caesars", unibet_us: "Unibet", wynnbet: "WynnBET"
    };
    return pretty[name] || name.charAt(0).toUpperCase() + name.slice(1);
  }

  function fmtTime(iso) {
    try {
      var d = new Date(iso);
      var day = d.toLocaleDateString(undefined, { weekday: "short" });
      var t = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      return day + " " + t;
    } catch (e) { return ""; }
  }

  function sideHtml(label, team, best) {
    if (!best || typeof best.price !== "number") return "";
    var negCls = best.price < 0 ? " neg" : "";
    return '<div class="side">' +
      '<span class="odds' + negCls + '">' + esc(fmtOdds(best.price)) + "</span>" +
      '<span class="book">' + esc(label) + " best: <b>" + esc(fmtBook(best.bookmaker)) + "</b></span>" +
      "</div>";
  }

  function buildCard(g) {
    var el = document.createElement("div");
    el.className = "card";
    var books = g.book_count ? g.book_count + (g.book_count === 1 ? " book" : " books") : "";
    var when = fmtTime(g.commence_time);
    var metaBits = [g.sport_title, when, books].filter(Boolean).join(" · ");
    el.innerHTML =
      '<div class="matchup">' +
        '<div class="teams">' + esc(g.away_team) + '<span class="at">@</span>' + esc(g.home_team) + "</div>" +
        '<div class="meta">' + esc(metaBits) + "</div>" +
      "</div>" +
      '<div class="prices">' +
        sideHtml(shortName(g.away_team), g.away_team, g.best_away) +
        sideHtml(shortName(g.home_team), g.home_team, g.best_home) +
      "</div>";
    return el;
  }

  function shortName(team) {
    if (!team) return "";
    var parts = team.split(" ");
    return parts.length > 1 ? parts[parts.length - 1] : team;
  }

  function showNext() {
    if (!games.length) return;
    idx = idx % games.length;
    var next = buildCard(games[idx]);
    idx = (idx + 1) % games.length;
    var prev = currentCard;
    stage.appendChild(next);
    // force layout so the transition runs
    void next.offsetWidth;
    next.classList.add("on");
    if (prev) {
      prev.classList.remove("on");
      setTimeout(function () {
        if (prev.parentNode) prev.parentNode.removeChild(prev);
      }, 450);
    }
    currentCard = next;
  }

  function applyData(data) {
    var list = (data && data.games) || [];
    var usable = [];
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      if (g && (g.best_home || g.best_away)) usable.push(g);
      if (usable.length >= maxGames) break;
    }
    var hadGames = games.length > 0;
    games = usable;
    if (sport) {
      sporttag.textContent = sport.slice(0, 18).toUpperCase();
    } else if (data && data.sport) {
      sporttag.textContent = String(data.sport).replace(/^[a-z]+_/, "").slice(0, 18).toUpperCase();
    } else {
      sporttag.textContent = "ALL SPORTS";
    }
    emptyEl.style.display = games.length ? "none" : "flex";
    if (!hadGames && games.length) {
      idx = 0;
      showNext();
    }
  }

  function refresh() {
    var url = API_BASE + (sport ? "?sport=" + encodeURIComponent(sport) : "");
    fetch(url, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function (data) {
        failCount = 0;
        livedot.classList.remove("stale");
        applyData(data);
      })
      .catch(function (err) {
        failCount++;
        // stay quiet on stream: keep last good data, dim the dot after repeated misses
        if (failCount >= 3) livedot.classList.add("stale");
        console.warn("ParlayAPI overlay fetch failed:", err && err.message);
      });
  }

  bar.classList.add("ready");
  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(showNext, speed * 1000);
})();
</script>
</body>
</html>
